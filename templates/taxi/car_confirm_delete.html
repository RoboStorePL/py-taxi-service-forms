{% extends "base.html" %}

{% block content %}
  <h1>Delete car?</h1>
  <p>Are you sure you want to delete {{ car.model }}?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-secondary" href="{% url 'taxi:car-detail' pk=car.id %}">
      Cancel
    </a>
  </form>
{% endblock %}
