{% extends "base.html" %}

{% block content %}
  <h1>Delete manufacturer?</h1>
  <p>Are you sure you want to delete {{ manufacturer.name }}?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-secondary" href="{% url 'taxi:manufacturer-list' %}">
      Cancel
    </a>
  </form>
{% endblock %}
